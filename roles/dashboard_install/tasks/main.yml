---
# --- Idempotency check ---

- name: Check if dashboard container is already running
  ansible.builtin.command:
    cmd: podman ps --filter name={{ dashboard_container_name }} --format {{ '{{' }}.Names{{ '}}' }}
  register: dashboard_running
  changed_when: false

- name: Skip install — dashboard container already running
  ansible.builtin.debug:
    msg: "Container '{{ dashboard_container_name }}' is already running. Skipping install."
  when: dashboard_container_name in dashboard_running.stdout

# --- Install block (skipped if container already running) ---

- name: Run dashboard installation
  when: dashboard_container_name not in dashboard_running.stdout
  block:

    # --- Prerequisites ---

    - name: Install ansible-core
      ansible.builtin.dnf:
        name: ansible-core
        state: present
      become: true

    # --- Extract bundle ---

    - name: Create bundle destination directory
      ansible.builtin.file:
        path: "{{ dashboard_bundle_dest }}"
        state: directory
        mode: "0755"

    - name: Extract dashboard setup bundle
      ansible.builtin.unarchive:
        src: "{{ dashboard_bundle_src }}"
        dest: "{{ dashboard_bundle_dest }}"
        remote_src: false
        creates: "{{ dashboard_install_dir }}/inventory.example"

    # --- Generate self-signed TLS certificate via openssl ---

    - name: Generate self-signed TLS certificate and private key
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -newkey rsa:4096 -nodes
          -keyout {{ dashboard_tls_key }}
          -out {{ dashboard_tls_cert }}
          -days {{ dashboard_tls_days_valid }}
          -subj "/CN={{ dashboard_tls_common_name }}"
          -addext "subjectAltName=DNS:{{ dashboard_tls_common_name }}"
        creates: "{{ dashboard_tls_cert }}"

    # --- Install bundled collections to standard path ---

    - name: Create user collections directory
      ansible.builtin.file:
        path: ~/.ansible/collections/ansible_collections
        state: directory
        mode: "0755"

    - name: Copy bundled collections to standard ansible collections path
      ansible.builtin.copy:
        src: "{{ dashboard_install_dir }}/collections/ansible_collections/"
        dest: ~/.ansible/collections/ansible_collections/
        remote_src: true

    # --- Create wrapper playbook outside collection dir ---

    - name: Create installer wrapper playbook at bundle root
      ansible.builtin.copy:
        dest: "{{ dashboard_install_dir }}/run_install.yml"
        mode: "0644"
        content: |
          ---
          - import_playbook: ansible.containerized_installer.dashboard_install

    # --- Template inventory ---

    - name: Template installer inventory
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/inventory.j2"
        dest: "{{ dashboard_install_dir }}/inventory"
        mode: "0600"

    # --- Run installer ---

    - name: Run dashboard installer playbook
      ansible.builtin.command:
        cmd: ansible-playbook run_install.yml --become
        chdir: "{{ dashboard_install_dir }}"
      environment:
        ANSIBLE_COLLECTIONS_PATH: "{{ dashboard_install_dir }}/collections"
        ANSIBLE_COLLECTIONS_PATHS: "{{ dashboard_install_dir }}/collections"
        ANSIBLE_BECOME_PASSWORD: "{{ ansible_become_password | default('') }}"
      register: dashboard_install_result
      changed_when: "'changed=' in dashboard_install_result.stdout"

    - name: Show installer recap
      ansible.builtin.debug:
        msg: "{{ dashboard_install_result.stdout_lines | select('match', '.*PLAY RECAP.*|.*ok=.*') | list }}"

# --- Post-install validation ---

- name: Verify dashboard container is running post-install
  ansible.builtin.command:
    cmd: podman ps --filter name={{ dashboard_container_name }} --format {{ '{{' }}.Names{{ '}}' }}
  register: post_install_check
  changed_when: false

- name: Fail if dashboard container is not running
  ansible.builtin.fail:
    msg: "Dashboard container '{{ dashboard_container_name }}' is not running after install. Check {{ dashboard_install_dir }}/aap_install.log"
  when: dashboard_container_name not in post_install_check.stdout

- name: Confirm dashboard is running
  ansible.builtin.debug:
    msg: "Dashboard container '{{ dashboard_container_name }}' is running successfully."
