---
aws_region: us-east-2
aws_availability_zone: us-east-2a

vpc_name: aap-dashboard-vpc
vpc_cidr: "10.0.0.0/16"
subnet_cidr: "10.0.0.0/24"
subnet_name: aap-dashboard-public-subnet

igw_name: aap-dashboard-igw
route_table_name: aap-dashboard-rt
sg_name: aap-dashboard-sg

ec2_instance_name: aap-dashboard
ec2_instance_type: t2.xlarge
ec2_key_pair_name: aap-dashboard-key
ec2_key_pair_path: ~/.ssh/aap-dashboard.pem

ec2_volume_size: 100

# Security group inbound rules
sg_rules:
  - proto: tcp
    ports: [22]
    cidr_ip: "0.0.0.0/0"
    rule_desc: SSH
  - proto: tcp
    ports: [443]
    cidr_ip: "0.0.0.0/0"
    rule_desc: HTTPS
  - proto: tcp
    ports: [8447]
    cidr_ip: "0.0.0.0/0"
    rule_desc: AAP Dashboard
  - proto: tcp
    ports: [5432]
    cidr_ip: "0.0.0.0/0"
    rule_desc: PostgreSQL
