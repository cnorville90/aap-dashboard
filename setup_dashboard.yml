---
# Usage:
#   ansible-playbook setup_dashboard.yml \
#     -e "aap_gateway_fqdn=aap-aap.apps.cluster-XXXXX.dynamic.redhatworkshops.io" \
#     --ask-vault-pass

- name: Provision EC2 instance for dashboard
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: ec2_provision

- name: Create OAuth2 app and token in AAP
  hosts: automationdashboard
  gather_facts: false
  vars:
    dashboard_host_ip: "{{ hostvars['localhost']['dashboard_host_ip'] }}"
  roles:
    - role: aap_oauth_setup

- name: Install automation dashboard
  hosts: automationdashboard
  gather_facts: false
  roles:
    - role: dashboard_install

- name: Configure automation dashboard
  hosts: automationdashboard
  gather_facts: true
  roles:
    - role: dashboard_configure

- name: Sync initial data
  hosts: automationdashboard
  gather_facts: false
  roles:
    - role: dashboard_sync
